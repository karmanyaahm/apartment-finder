# Goals are filters over stored data. Changing anything here needs no new scrape.
#
# Rule types (see src/aptfinder/filter/rules.py RULE_TYPES; the dashboard's goal editor writes the same shapes):
#   equals        field, value                 term, furnished, private_bath, kind, restriction, parking_included,
#                                              is_apartment_building
#   max / min     field, value, strict?        price, price_month, price_per_bed, price_per_person, beds, baths, sqft,
#                                              parking_spots, parking_usd_month, building_units
#   size_options  options = [{beds, min_baths}] beds must match one option with baths >= min_baths
#   dates_cover   start, end                   available for the whole range; a stated minimum stay longer fails
#   commute_any   target, options=[{mode,max}], in_net?   at least one mode within max minutes to the target
#   near          set, mode, max, in_net?      nearest point of a set within max minutes
#   amenity       name, match?, exclude?       amenities list matches name or a match word, none of exclude
#   known         field                        field is present
#   net_commute   agg, max                     the goal's counted commutes combined (total, mean, median, spread)
#   not_operator  name                         not rented out by this operator (config/operators.toml)
#   parking_cost  spots                        what N parking spaces add a month; a nice-to-have that ranks
#   (restriction: who may rent: none | income | senior | veterans | student | employer | other; a limit stated
#    anywhere at the place holds for all its listings; nothing stated = assumed none)
# A goal may set `people = N` (roommates sharing a group lease): price_per_person = price_month / N.
# in_net: whether a commute or near rule counts in the net commute (default: must-haves yes, nice-to-haves no).
# Missing input never rejects: the rule returns needs_check and names the field.

[verify]
min_samples = 5      # a source/field needs at least this many hand checks before accuracy counts
min_accuracy = 0.8   # below this, the field from that source is treated as needs_check
sample_fields = ["price", "beds", "baths", "sqft", "available_from", "address"]
min_price_per_bed = 1000  # a lease below this per bedroom (studio = 1) goes to Verify: per-room or misread price?

[goals.temp]
label = "Temp stay, 1 person, Dec 1 2026 - Jan 1 2027"

# The stay is about a month: an ordinary 12-month lease does not fit, even furnished.
[[goals.temp.rules]]
type = "equals"
field = "term"
value = "short"

[[goals.temp.rules]]
type = "equals"
field = "furnished"
value = true

[[goals.temp.rules]]
type = "equals"
field = "private_bath"
value = true

[[goals.temp.rules]]
type = "dates_cover"
start = "2026-12-01"
end = "2027-01-01"

[[goals.temp.rules]]
type = "commute_any"
target = "commute_targets:Downtown Palo Alto"
options = [
  { mode = "bike", max = 8 },
  { mode = "walk", max = 25 },
  { mode = "transit", max = 25 },
]

[[goals.temp.rules]]
type = "max"
field = "price_month"
value = 4000

# No income, senior, veterans, student or employer limit on who may rent. Off in the example: a listing not read
# yet by `aptf-intake extract` is needs_check under it. Uncomment (or add it in the dashboard) once readings exist.
# [[goals.temp.rules]]
# type = "equals"
# field = "restriction"
# value = "none"

[goals.lease]
label = "Group lease"

[[goals.lease.rules]]
type = "equals"
field = "term"
value = "long"

[[goals.lease.rules]]
type = "size_options"
options = [
  { beds = 3, min_baths = 2 },   # 3/2, 3/2.5, 3/3
]

[[goals.lease.rules]]
type = "max"
field = "price_per_bed"
value = 2500
strict = true

# [[goals.lease.rules]]
# type = "equals"
# field = "restriction"
# value = "none"

[[goals.lease.nice]]
type = "max"
field = "price_per_bed"
value = 2000

[[goals.lease.nice]]
type = "amenity"
name = "gym"
match = ["gym", "fitness"]   # "Fitness Center" counts

[[goals.lease.nice]]
type = "near"
set = "caltrain_stations"
mode = "walk"
max = 20

[[goals.lease.nice]]
type = "near"
set = "google_bus_stops"
mode = "walk"
max = 10

[[goals.lease.nice]]
type = "known"
field = "sqft"

# More rule shapes, as a goal might use them (uncomment to try; the editor offers each as a preset):
