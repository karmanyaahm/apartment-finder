# Intake sources. Every listing source runs through an Apify actor (see AGENTS.md).
# Spend is capped twice: by Apify itself (maxTotalChargeUsd / maxItems on the run) and by max_usd_per_run here.

[spend]
max_usd_per_run = 1.0
# Never spend the last of the monthly Apify credit on bulk intake (kept for direct-site tests etc.).
reserve_usd = 0.30

[airbnb]
actor = "tri_angle/airbnb-scraper"
max_items = 150          # the box held ~130 listings for these dates (2026-11-24); beyond that Airbnb spills outside it
# Real dates at least 28 days apart so the returned price is the monthly-discounted one.
checkin = "2026-12-01"
checkout = "2027-01-01"
adults = 1
# Airbnb now searches the station boxes in config/areas.toml. This box is the one searched on
# 2026-11-24 before areas existed; kept so the coverage ledger can credit station boxes inside it.
box = [37.395, -122.20, 37.475, -122.10]

[furnishedfinder]
actor = "shahidirfan/furnished-finder-scraper"
max_items = 300
max_pages = 15

[zillow]
actor = "clearpath/zillow-zip-code-search-scraper"
max_items = 400

[apartments_com]
actor = "memo23/apify-apartments-cheerio"   # epctex caps free-plan users at 10 items
max_items = 150          # buildings per city page
memory_mb = 1024         # 256 MB (the default) ran out of memory after 16 of 43 pages

[craigslist]
actor = "solidcode/craigslist-scraper"
max_items = 300
radius_miles = 1.5      # search radius around each ZIP's centre

[direct]
actor = "apify/cheerio-scraper"   # generic scraper; platform parsers in intake/direct.py, sites in direct_sites.toml
max_items = 5                     # one page per site

[google_places]
# Official API, not Apify (see config/google.toml for pricing and the monthly cap). One search per station box
# (`[[box]]` in areas.toml) and query; strict type filtering keeps only places Google types as that kind.
max_calls = 30           # per run (each page of up to 20 results is one call; 3 pages max per query)
max_items = 200          # per box
queries = [
  { text = "apartments", type = "apartment_complex" },
  { text = "apartments", type = "apartment_building" },
]

[zumper]
# Chosen 2026-11-24 by a 25-item probe (design.md): with getDetails a building comes with its offered floor plans
# and its own website. $0.00099 per item (each item is a building or a single unit), $0.00005 per start.
actor = "scrapemind/zumperCom-Scraper"
max_items = 300          # per city. The actor has no item limit of its own and Apify's maxItems did not stop it
                         # (a 5-item probe returned and charged 25): --max-usd is the real bound
full_scrape = true       # every results page (false: the first page, about 25)

[padmapper]
# PadMapper is Zumper's (same listing ids). Search results only: buildings as ranges, single units exact.
# $0.0024 per item, $0.00005 per start.
actor = "bovi/padmapper-scraper"
# Left out of routine runs, coverage and the pipeline (2026-11-25): every PadMapper item of Mountain View and of an
# uncapped Sunnyvale run was also in Zumper's data. `run padmapper` refuses while this is true.
skip = true
max_items = 300
max_pages = 20

[portfolio]
# Operators' own city pages, rendered through Apify (one run for all operator x city pages), read by Claude Haiku
# with every answer checked against the page (intake/portfolio.py). URL templates were found by web search
# 2026-11-24; `{slug}` is the city, e.g. mountain-view. A city an operator has no page for answers 404 (nothing).
actor = "apify/playwright-scraper"
memory_mb = 2048
model = "haiku"
max_claude_usd = 0.5     # per run
operators = [
  { name = "Equity Residential", url = "https://www.equityapartments.com/san-francisco-bay/{slug}-apartments", proxy = "residential" },
  { name = "Essex", url = "https://www.essexapartmenthomes.com/apartments/{slug}", proxy = "residential" },
  { name = "Irvine Company", url = "https://www.irvinecompanyapartments.com/locations/northern-california/{slug}.html", proxy = "residential" },
  { name = "Greystar", url = "https://www.greystar.com/s/{slug}-ca" },
  { name = "UDR", url = "https://www.udr.com/san-francisco-bay-area-apartments/{slug}" },
  { name = "Prometheus", url = "https://prometheusapartments.com/ca/{slug}-apartments/", proxy = "residential" },
  { name = "AvalonBay", url = "https://www.avaloncommunities.com/california/{slug}-apartments" },
]
