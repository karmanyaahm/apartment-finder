# Who runs a building, as evidence of who may rent it (`config.operator_restriction`, read by the filter).
# A place matches an operator when a listing there gives its own site on one of `domains` (a direct or portfolio
# row's URL, a Google Places website, or a website extract read from a listing's text; the host or any subdomain)
# or names it in the operator field (`names`, exact, any case).
#   restriction = "income": an affordable-housing nonprofit or housing authority. The place counts as
#     income-restricted, evidence "operator: <name> (affordable-housing nonprofit)", source 'operator', over a
#     listing's 'none'; a quoted limit there (senior, employer, ...) wins, and so does a page that says market-rate
#     in so many words (a 'none' with its quote).
#   restriction = "none": a market-rate REIT or manager. The place counts as no limit, evidence "operator: <name>
#     (market-rate)", only where nothing was read (unknown); any quoted limit there (income, senior, employer) wins.
#     Some of them run a few BMR units, which are no building-wide limit.
# Your Verify answer wins over both. A copy in config/ replaces this list.

# ---- affordable-housing nonprofits and housing authorities
[[operator]]
name = "MidPen Housing"
restriction = "income"
domains = ["midpen-housing.org"]

