# Google Routes API metering. Every call is logged in the `api_calls` table and checked against these
# monthly caps before it is made (calendar month, UTC).
# Pricing read 2026-11-24 from developers.google.com/maps/billing-and-pricing (sku-details/routes):
#   Compute Routes Essentials $5 / 1,000, first 10,000 a month free (walk, transit, traffic-unaware drive).
#   Enterprise $15 / 1,000, first 1,000 free: "two-wheeled vehicle routing". Whether BICYCLE counts as
#   that is not stated, so bicycle calls get their own cap under the Enterprise free tier until confirmed.
monthly_call_cap = 5000
monthly_cap_by_mode = { bike = 900 }
price_per_1000_usd = 5.0
free_calls_per_month = 10000

# Google Places API (New) Text Search (`aptf-intake run google_places`), metered separately from Routes in
# `api_calls` (provider `places`), one row per request (each page of results is a request).
# Pricing read 2026-11-24 from developers.google.com/maps/billing-and-pricing/pricing and .../places/web-service/data-fields:
#   our field mask includes websiteUri, nationalPhoneNumber, rating, userRatingCount -> Text Search Enterprise SKU,
#   $35 / 1,000 requests, first 1,000 a month free (Pro alone: $32 / 1,000, 5,000 free; IDs only: free, unlimited).
# The cap stays under the Enterprise free tier.
places_monthly_call_cap = 900
places_price_per_1000_usd = 35.0
places_free_calls_per_month = 1000

# Geocoding (building identity, identity/addresses.py): 10,000 free a month, then $5 per 1,000 (2026-11-24)
geocoding_monthly_call_cap = 4900
