[project]
name = "aptfinder"
version = "0.1.0"
description = "Local apartment finder: append-only listing store, goal filters, map dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
intake = ["apify-client>=1.8"]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
aptf-db = "aptfinder.store.cli:main"
aptf-intake = "aptfinder.intake.cli:main"
aptf-identity = "aptfinder.identity.cli:main"
aptf-commute = "aptfinder.trips:main"
aptf-filter = "aptfinder.filter.cli:main"
aptf-verify = "aptfinder.verify.cli:main"
aptf-web = "aptfinder.web.cli:main"
aptf-eval = "aptfinder.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aptfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
