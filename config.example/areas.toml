# Intake areas: everything inside each Caltrain station's 25-minute walk zone (radius 1.54 km).
# Generated by scripts/plan_areas.py (Nominatim reverse geocoding, ~500 m sample grid). Edit freely.
# Chunks are worked in this order; coverage per source and area: `aptf-intake coverage`.
# `samples` = how many grid points fell in that ZIP (small numbers mean the zone only clips it).
# Removed by hand 2026-11-24: PO-box / mistagged ZIPs 94035, 94039, 94088, 94807 and OSM neighbourhood
# names 'Rains Houses', 'Menlo Oaks' (not cities).

chunks = ["mountain_view", "palo_alto", "redwood_city", "sunnyvale"]
# Chunks being worked now. Places outside them are marked TODO in the dashboard and get no paid routing.
active = ["mountain_view"]
radius_km = 1.54
chunk_stations = { mountain_view = ["Mountain View", "San Antonio"], palo_alto = ["Palo Alto", "California Ave", "Menlo Park"], redwood_city = ["Redwood City"], sunnyvale = ["Sunnyvale", "Lawrence"] }

